name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # Known pre-existing ESLint debt (~26 react-hooks/react-refresh errors). Soft-fail until cleaned separately.
      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build
